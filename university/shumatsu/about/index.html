<h1>習松大学について</h1>
<p>習松大学は北方地域を代表する総合研究大学として、 民俗学、宗教学、考古学等の分野で長年にわたり研究活動を行っています。</p>
<p>近年は食人種生態学会との共同研究を推進し、 各地域の伝承資料および文化資料の保存活動にも力を入れています。</p>
<h1>アクセス</h1>
<p>OBS-100<br>
山成県習松市江須賀5-5-1</p>
<p>習大前駅から徒歩10分</p>
